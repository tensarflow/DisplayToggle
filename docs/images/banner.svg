<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="DisplayToggle: turn monitors off without unplugging them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101638"/>
      <stop offset="1" stop-color="#1f2c7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#6a8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6a8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcbff"/>
      <stop offset="1" stop-color="#4c7dff"/>
    </linearGradient>
    <linearGradient id="screen2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4a8ff"/>
      <stop offset="1" stop-color="#6b5cff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="200" font-size="74" font-weight="700" fill="#ffffff" letter-spacing="-1.5">DisplayToggle</text>
    <text x="80" y="268" font-size="36" font-weight="600" fill="#c9d4ff">Turn monitors off</text>
    <text x="80" y="314" font-size="36" font-weight="600" fill="#c9d4ff">without unplugging them.</text>
    <text x="80" y="370" font-size="21" fill="#94a3d8">They vanish from System Settings › Displays.</text>
    <text x="80" y="400" font-size="21" fill="#94a3d8">One click brings them back.</text>

    <!-- Chips -->
    <g font-size="17" font-weight="600" fill="#dfe6ff">
      <rect x="80" y="440" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="155" y="465" text-anchor="middle">Menu bar app</text>
      <rect x="242" y="440" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="317" y="465" text-anchor="middle">displayctl CLI</text>
      <rect x="404" y="440" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="479" y="465" text-anchor="middle">Apple Silicon</text>
    </g>

    <!-- Terminal line -->
    <rect x="80" y="506" width="474" height="54" rx="12" fill="#0a0e24" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="104" y="540" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#7d8bbd">$</text>
    <text x="126" y="540" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#e8ecff">displayctl off <tspan fill="#8fcbff">"Right monitor"</tspan></text>
  </g>

  <!-- Illustration: three monitors, the right one switched off and fading out -->
  <g transform="translate(655 150) scale(0.92)">
    <!-- left monitor -->
    <rect x="0" y="40" width="210" height="140" rx="16" fill="#f4f6ff"/>
    <rect x="12" y="52" width="186" height="116" rx="7" fill="url(#screen2)"/>
    <rect x="95" y="180" width="20" height="30" fill="#f4f6ff"/>
    <rect x="62" y="206" width="86" height="12" rx="6" fill="#f4f6ff"/>

    <!-- center monitor (main) -->
    <rect x="170" y="0" width="270" height="180" rx="18" fill="#ffffff"/>
    <rect x="184" y="14" width="242" height="152" rx="8" fill="url(#screen)"/>
    <rect x="184" y="14" width="242" height="14" rx="4" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="296" y="180" width="24" height="36" fill="#ffffff"/>
    <rect x="256" y="212" width="104" height="13" rx="6.5" fill="#ffffff"/>

    <!-- right monitor: off, dashed, fading -->
    <g opacity="0.75">
      <rect x="445" y="40" width="190" height="128" rx="16" fill="#0b0f2a" stroke="#8c9cff" stroke-width="3" stroke-dasharray="10 8"/>
      <g fill="none" stroke="#8c9cff" stroke-width="7" stroke-linecap="round">
        <path d="M 525 91 A 26 26 0 1 0 555 91"/>
        <line x1="540" y1="78" x2="540" y2="106"/>
      </g>
    </g>

    <!-- menu card -->
    <g transform="translate(120 262)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="0" y="0" width="330" height="170" rx="14" fill="#1a2150" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="20" y="30" font-size="13" font-weight="700" fill="#8e9acb">DISPLAYS</text>
      <g font-size="17" fill="#eef1ff">
        <text x="20" y="62">✓</text><text x="44" y="62">Left monitor</text><text x="310" y="62" text-anchor="end" fill="#8e9acb">2560×1440</text>
        <text x="20" y="92">✓</text><text x="44" y="92">Main monitor</text><text x="310" y="92" text-anchor="end" fill="#8e9acb">3840×2160</text>
        <text x="44" y="122" fill="#aab4e0">Right monitor</text><text x="310" y="122" text-anchor="end" fill="#6d78a8">off</text>
      </g>
      <line x1="16" y1="138" x2="314" y2="138" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="44" y="160" font-size="15" fill="#c9d4ff">Turn All Back On</text>
    </g>
  </g>
</svg>
